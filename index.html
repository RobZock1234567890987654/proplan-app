<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPlan Cloud v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: #111827;
            padding: 25px;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .main { flex: 1; padding: 40px; overflow-y: auto; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border-left: 6px solid var(--primary);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            max-width: 95%;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color: var(--primary); margin-bottom: 5px;">📅 ProPlan</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 30px;">Cloud & Reminder Sync</p>
        
        <button class="btn" onclick="toggleModal(true)" style="margin-bottom: 15px;">+ Neuer Termin</button>
        <button class="btn" onclick="app.enableNotifications()" style="background: #334155; font-size: 0.85rem;">🔔 Benachrichtigung erlauben</button>
        
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #334155;">
            <p style="font-size: 0.75rem; color: #64748b;">System-Status:</p>
            <span class="status-badge" id="notif-text">Glocke inaktiv</span>
        </div>
    </aside>

    <main class="main">
        <h1 style="margin-bottom: 30px;">Deine Übersicht</h1>
        <div id="grid" class="grid"></div>
    </main>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3>Termin & Erinnerung</h3>
            <form id="appt-form">
                <label>Was hast du vor?</label>
                <input type="text" id="title" placeholder="z.B. Fitnessstudio" required>
                
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Datum</label>
                        <input type="date" id="date" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Uhrzeit</label>
                        <input type="time" id="time" required>
                    </div>
                </div>

                <label>Wann soll ich dich erinnern?</label>
                <select id="notify_time">
                    <option value="0">Pünktlich</option>
                    <option value="5">5 Minuten vorher</option>
                    <option value="15">15 Minuten vorher</option>
                    <option value="60">1 Stunde vorher</option>
                    <option value="-1">Gar nicht</option>
                </select>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" class="btn" style="background: #475569; flex: 1;" onclick="toggleModal(false)">Abbrechen</button>
                    <button type="submit" class="btn" style="flex: 2;">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://pkwauyeokfzgultkgbxj.supabase.co";
        const SB_KEY = "sb_publishable_yYRVACh1Otfjz7yDXzQgfw_f-oHIDxn";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        class ProPlanCloud {
            constructor() {
                this.appointments = [];
                this.sentNotifications = new Set();
                this.init();
            }

            async init() {
                document.getElementById('appt-form').onsubmit = (e) => this.save(e);
                await this.load();
                
                // Alle 15 Sekunden prüfen (für präzise Benachrichtigungen)
                setInterval(() => this.checkAndNotify(), 15000);
            }

            async load() {
                const { data, error } = await _supabase.from('appointments').select('*').order('date');
                if (!error) {
                    this.appointments = data;
                    this.render();
                }
            }

            async save(e) {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerText = "Speichere...";
                
                const entry = {
                    title: document.getElementById('title').value,
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    notify_lead_time: parseInt(document.getElementById('notify_time').value)
                };

                await _supabase.from('appointments').insert([entry]);
                toggleModal(false);
                e.target.reset();
                btn.innerText = "Speichern";
                this.load();
            }

            enableNotifications() {
                Notification.requestPermission().then(permission => {
                    const statusText = document.getElementById('notif-text');
                    if (permission === 'granted') {
                        statusText.innerText = "🔔 Aktiv";
                        statusText.style.color = "#10b981";
                        new Notification("ProPlan", { body: "Super! Ich erinnere dich ab jetzt an deine Termine." });
                    } else {
                        statusText.innerText = "🔕 Blockiert";
                        statusText.style.color = "#f43f5e";
                    }
                });
            }

            checkAndNotify() {
                if (Notification.permission !== "granted") return;

                const now = new Date();
                this.appointments.forEach(appt => {
                    if (appt.notify_lead_time === -1) return;

                    const apptTime = new Date(`${appt.date}T${appt.time}`);
                    const triggerTime = new Date(apptTime.getTime() - appt.notify_lead_time * 60000);

                    // Falls die Zeit erreicht ist und wir für diesen Termin noch nicht genervt haben
                    if (now >= triggerTime && now < apptTime && !this.sentNotifications.has(appt.id)) {
                        this.triggerVisualNotification(appt);
                        this.sentNotifications.add(appt.id);
                    }
                });
            }

            triggerVisualNotification(appt) {
                const text = appt.notify_lead_time === 0 ? "Jetzt fällig!" : `In ${appt.notify_lead_time} Minuten fällig.`;
                new Notification(appt.title, {
                    body: text,
                    icon: "https://cdn-icons-png.flaticon.com/512/552/552402.png",
                    tag: appt.id // Verhindert doppelte Popups
                });
            }

            render() {
                const grid = document.getElementById('grid');
                grid.innerHTML = this.appointments.map(a => `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <small style="color:#94a3b8;">${a.date} | ${a.time}</small>
                            ${a.notify_lead_time !== -1 ? '<span>🔔</span>' : ''}
                        </div>
                        <h3 style="margin:15px 0;">${a.title}</h3>
                        <button onclick="app.delete('${a.id}')" style="background:none; border:none; color:#f43f5e; cursor:pointer; padding:0;">Löschen</button>
                    </div>
                `).join('');
            }

            async delete(id) {
                await _supabase.from('appointments').delete().eq('id', id);
                this.load();
            }
        }

        function toggleModal(s) { document.getElementById('modal-overlay').style.display = s ? 'flex' : 'none'; }
        const app = new ProPlanCloud();
    </script>
</body>
</html>
