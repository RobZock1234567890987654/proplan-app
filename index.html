<style>
    :root {
        --primary: #6366f1;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --sidebar-width: 280px;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        display: flex; /* Wichtig für PC-Layout */
        height: 100vh;
        overflow: hidden;
    }

    /* Sidebar Design */
    .sidebar {
        position: fixed;
        left: -280px; /* Standard für Mobile */
        top: 0;
        width: var(--sidebar-width);
        height: 100%;
        background: var(--card);
        z-index: 200;
        transition: 0.3s ease;
        padding: 20px;
        box-sizing: border-box;
        border-right: 1px solid #334155;
    }

    /* PC-Modus: Sidebar fest anzeigen */
    @media (min-width: 1024px) {
        .sidebar {
            position: relative; /* Nicht mehr überlagernd */
            left: 0;
            display: block;
        }
        .menu-icon { display: none; } /* Burger-Button am PC verstecken */
        
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    }

    /* Mobile-Modus: Sidebar überlagernd wenn offen */
    .sidebar.open { left: 0; }

    /* Container für den Rest der App */
    .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
    }

    header {
        padding: 15px 20px;
        background: #111827;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #334155;
    }

    main {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }

    /* Toggle Switch Styles (bleiben gleich wie vorher) */
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; color: white; text-decoration: none; }
</style>

<body>
    <div id="sidebar" class="sidebar">
        <h2 style="color: var(--primary)">ProPlan Menü</h2>
        <div class="menu-item">
            <span>🔔 Benachrichtigungen</span>
            <label class="switch">
                <input type="checkbox" id="notif-toggle" onclick="app.toggleNotifications(this)">
                <span class="slider"></span>
            </label>
        </div>
        <a href="#" class="menu-item" onclick="location.reload()">🔄 Aktualisieren</a>
        
        <button onclick="toggleMenu(false)" class="btn-save" id="close-btn-mobile" style="background:#334155; margin-top: 30px;">Schließen</button>
    </div>

    <div class="main-wrapper">
        <header>
            <button class="menu-icon" onclick="toggleMenu(true)" style="background:none; border:none; color:white; font-size:1.5rem;">☰</button>
            <h1>📅 Termine</h1>
            <div style="width: 24px;"></div>
        </header>

        <main>
            <div id="grid" class="grid">
                </div>
        </main>
    </div>

    <button class="fab" onclick="toggleModal(true)">+</button>
    
    </body>
