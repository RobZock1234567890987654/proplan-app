<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPlan Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --sidebar-width: 280px;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
        }

        /* --- MAIN --- */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        header {
            padding: 0 20px;
            height: 60px;
            background: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        main { flex: 1; overflow-y: auto; padding: 20px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            position: relative;
        }

        /* --- MODAL --- */
        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }

        .modal-content {
            background: var(--card); padding: 25px; border-radius: 15px;
            width: 90%; max-width: 450px; border: 1px solid var(--border);
        }

        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #0f172a; border: 1px solid var(--border);
            color: white; border-radius: 8px;
        }

        .btn-primary {
            background: var(--primary); color: white; border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%;
        }

        .fab {
            position: fixed; bottom: 25px; right: 25px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--primary); color: white; border: none;
            font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .menu-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; color: white; text-decoration: none; border-radius: 8px;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <aside id="sidebar" class="sidebar">
        <h2 style="color: var(--primary)">ProPlan</h2>
        <nav style="flex: 1">
            <a href="#" class="menu-item" onclick="location.reload()">🔄 Aktualisieren</a>
            <div class="menu-item">
                <span>🔔 Push-Infos</span>
                <input type="checkbox" id="notif">
            </div>
        </nav>
        <button class="btn-primary" style="background: #334155" onclick="toggleMenu()">Schließen</button>
    </aside>

    <div class="main-wrapper">
        <header>
            <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer">☰</button>
            <h1>Termine</h1>
            <div style="width: 24px"></div>
        </header>

        <main>
            <div id="grid" class="grid">
                <p>Lade Daten...</p>
            </div>
        </main>
    </div>

    <button class="fab" onclick="toggleModal(true)">+</button>

    <div id="modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Neuer Termin</h2>
            <input type="text" id="task-title" placeholder="Titel des Termins">
            <textarea id="task-desc" rows="3" placeholder="Details..."></textarea>
            <button class="btn-primary" id="save-btn" onclick="addTask()">Termin speichern</button>
            <button class="btn-primary" style="background:none; margin-top:10px" onclick="toggleModal(false)">Abbrechen</button>
        </div>
    </div>

    <script>
        // --- Supabase Konfiguration ---
        const SUPABASE_URL = 'https://pkwauyeokfzgultkgbxj.supabase.co';
        const SUPABASE_KEY = 'DEIN_ANON_KEY_HIER_EINSETZEN'; // <--- WICHTIG!
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- UI Steuerung ---
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleModal(show) {
            document.getElementById('modal').style.display = show ? 'flex' : 'none';
        }

        // --- Daten Operationen ---
        async function fetchTasks() {
            const grid = document.getElementById('grid');
            try {
                const { data, error } = await supabaseClient
                    .from('tasks') // Stelle sicher, dass deine Tabelle 'tasks' heißt
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                grid.innerHTML = data.length ? data.map(t => `
                    <div class="card">
                        <h3 style="margin:0 0 10px 0">${t.title}</h3>
                        <p style="color:var(--text-muted); margin:0">${t.description || ''}</p>
                    </div>
                `).join('') : '<p>Noch keine Termine vorhanden.</p>';

            } catch (err) {
                grid.innerHTML = `<p style="color:#ef4444">Fehler: ${err.message}</p>`;
            }
        }

        async function addTask() {
            const title = document.getElementById('task-title').value;
            const desc = document.getElementById('task-desc').value;
            const btn = document.getElementById('save-btn');

            if (!title) return alert("Titel fehlt!");

            btn.disabled = true;
            btn.innerText = "Wird gespeichert...";

            try {
                const { error } = await supabaseClient
                    .from('tasks')
                    .insert([{ title, description: desc }]);

                if (error) throw error;

                // Reset & Refresh
                document.getElementById('task-title').value = '';
                document.getElementById('task-desc').value = '';
                toggleModal(false);
                fetchTasks();
            } catch (err) {
                alert("Fehler: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Termin speichern";
            }
        }

        // Initiales Laden
        fetchTasks();
    </script>
</body>
</html>
