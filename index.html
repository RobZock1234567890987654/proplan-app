<style>
    :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --bg: #0f172a;
        --card: #1e293b;
        --card-hover: #2d3748;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --sidebar-width: 280px;
        --border: #334155;
        --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* --- Sidebar Design --- */
    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        width: var(--sidebar-width);
        height: 100%;
        background: #111827; /* Etwas dunkler als Main-BG */
        z-index: 200;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 24px;
        box-sizing: border-box;
        border-right: 1px solid var(--border);
    }

    @media (min-width: 1024px) {
        .sidebar {
            position: relative;
            left: 0;
            display: flex;
            flex-direction: column;
        }
        .menu-icon { display: none; }
    }

    .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }

    .sidebar h2 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* --- Navigation Items --- */
    .menu-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        margin: 4px 0;
        border-radius: 10px;
        color: var(--text-muted);
        text-decoration: none;
        transition: all 0.2s;
        border-bottom: none; /* Entfernt die alte Linie */
    }

    .menu-item:hover {
        background: var(--card);
        color: white;
    }

    /* --- Main Content --- */
    .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at top right, #1e293b, #0f172a); /* Dezenter Gradient */
    }

    header {
        padding: 1rem 2rem;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    header h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
    }

    main {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
    }

    /* --- UI Elements --- */
    .btn-save {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-save:hover {
        filter: brightness(1.2);
    }

    .fab {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 56px;
        height: 56px;
        border-radius: 18px; /* Modern Squircle */
        background: var(--primary);
        color: white;
        border: none;
        font-size: 24px;
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        cursor: pointer;
        transition: transform 0.2s;
    }

    .fab:hover {
        transform: scale(1.05) rotate(90deg);
        background: var(--primary-hover);
    }

    /* --- Custom Toggle Switch --- */
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { 
        position: absolute; cursor: pointer; inset: 0; 
        background-color: #334155; transition: .3s; border-radius: 34px; 
    }
    .slider:before { 
        position: absolute; content: ""; height: 14px; width: 14px; 
        left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; 
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>

<body>
    <div id="sidebar" class="sidebar">
        <h2 style="color: var(--primary)">
            <span style="font-size: 1.5rem;">🚀</span> ProPlan
        </h2>
        
        <div class="menu-item">
            <span>🔔 Push-Infos</span>
            <label class="switch">
                <input type="checkbox" id="notif-toggle" onclick="app.toggleNotifications(this)">
                <span class="slider"></span>
            </label>
        </div>
        
        <a href="#" class="menu-item" onclick="location.reload()">
            <span>🔄 Aktualisieren</span>
        </a>

        <div style="flex: 1;"></div> <!-- Spacer -->

        <button onclick="toggleMenu(false)" class="btn-save" id="close-btn-mobile" 
                style="background: var(--card); color: var(--text-muted); margin-bottom: 10px;">
            Schließen
        </button>
    </div>

    <div class="main-wrapper">
        <header>
            <button class="menu-icon" onclick="toggleMenu(true)" 
                    style="background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid var(--border); color: white; padding: 5px 10px; cursor: pointer;">
                ☰
            </button>
            <h1>Terminübersicht</h1>
            <div style="width: 32px; height: 32px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem;">
                JS
            </div>
        </header>

        <main>
            <!-- Hier kommen deine Karten/Grid rein -->
            <div id="grid" class="grid">
                <!-- Beispiel für eine Karte (falls du sie stylen willst) -->
                <div style="background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border);">
                    <h3 style="margin-top: 0;">Willkommen zurück!</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Deine Termine für heute sind geladen.</p>
                </div>
            </div>
        </main>
    </div>

    <button class="fab" onclick="toggleModal(true)">+</button>
</body>
